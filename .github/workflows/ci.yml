name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Lint, TypeCheck, Build
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Lint
        run: npm run lint
        # если у тебя нет скрипта lint — добавь в package.json:
        # "lint": "next lint"

      - name: ✅ TypeScript check
        run: npx tsc --noEmit
        # проверяет типы без генерации файлов

      - name: 🏗️ Build
        run: npm run build

      - name: 📊 Bundle analysis (optional)
        run: |
          echo "Build successful!"
          echo "Node: $(node -v)"
          echo "NPM: $(npm -v)"